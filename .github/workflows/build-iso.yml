
name: Nexus Linux ISO Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nexus Linux Lite
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate packages on Debian Trixie
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /workspace \
            debian:trixie \
            bash -euc '
              apt-get update

              mapfile -t packages < <(
                grep -Ev "^[[:space:]]*(#|$)" \
                  config/package-lists/nexus-lite.list.chroot
              )

              apt-get install --simulate \
                --no-install-recommends \
                "${packages[@]}"
            '

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            debian-archive-keyring

      - name: Verify Debian archive keyring
        run: |
          test -s /usr/share/keyrings/debian-archive-keyring.gpg
          echo "Debian archive keyring found."

      - name: Validate build script
        run: bash -n scripts/build.sh

      - name: Build Nexus Linux ISO
        run: |
          sudo env DEBIAN_SUITE=trixie \
            bash scripts/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Linux-Lite-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
