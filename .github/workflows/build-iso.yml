
name: Nexus Linux ISO Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Nexus Linux Lite
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools

      - name: Validate build script
        run: bash -n scripts/build.sh

      - name: Build Nexus Linux ISO
        run: |
          sudo env DEBIAN_SUITE=trixie \
            bash scripts/build.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-Linux-Lite-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 7
