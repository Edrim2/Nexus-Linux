
name: Nexus Linux CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Nexus Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -s README.md
          test -s LICENSE
          test -s docs/ARCHITECTURE.md
          test -s config/package-lists/nexus-lite.list.chroot
          test -s scripts/build.sh
          test -s scripts/check.sh

      - name: Validate shell scripts
        run: |
          bash -n scripts/build.sh
          bash -n scripts/check.sh

      - name: Run project checker
        run: bash scripts/check.sh

      - name: Report success
        run: echo "Nexus Linux validation completed successfully!"
